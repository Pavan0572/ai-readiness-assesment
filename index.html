<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AI Readiness Assessment</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
:root{--bg:#fff;--ink:#222;--mute:#5a5a5a;--line:#e4e4e4;--panel:#f5f5f5;--red:#d10000;--btn:#d10000;--sel:#fdf0f0;--dot:#bbb;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141414;--ink:#f0f0f0;--mute:#a8a8a8;--line:#333;--panel:#1f1f1f;--red:#ff6161;--sel:#2b1717;--dot:#666;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#141414;--ink:#f0f0f0;--mute:#a8a8a8;--line:#333;--panel:#1f1f1f;--red:#ff6161;--sel:#2b1717;--dot:#666;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.55 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:1120px;margin:0 auto;padding:56px 24px 72px}
.grid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:64px;align-items:start}
.grid.wide{grid-template-columns:minmax(0,1.35fr) minmax(0,1fr)}
.eye{display:flex;gap:8px;align-items:center;font-size:13px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--red);margin:0 0 16px}
.eye.g{color:var(--mute);margin:0 0 6px;font-size:12px}
h1{font-size:clamp(36px,5.6vw,60px);line-height:1.08;letter-spacing:-.035em;font-weight:700;margin:0 0 24px}
h2{font-size:clamp(28px,4.2vw,40px);line-height:1.15;letter-spacing:-.03em;font-weight:700;margin:0 0 12px}
h2.h3{font-size:24px;margin:36px 0 14px}
p{margin:0 0 14px}
.lead{font-size:20px;line-height:1.55;margin:0 0 16px}
.why,.inst,.note{color:var(--mute)}
.note{font-size:14px}
.btn{display:inline-flex;gap:10px;align-items:center;background:var(--btn);color:#fff;border:1px solid var(--btn);border-radius:4px;padding:16px 28px;font:600 17px Inter,system-ui,sans-serif;cursor:pointer;text-decoration:none}
.btn:disabled{opacity:.35;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
:focus-visible{outline:3px solid var(--red);outline-offset:2px}
.acts{margin:28px 0 30px}
.meta{display:flex;flex-wrap:wrap;gap:14px 28px;border-top:1px solid var(--line);padding-top:26px;color:var(--mute);font-size:16px}
.meta span{display:flex;gap:10px;align-items:center}
.fw{list-style:none;margin:0 0 18px;padding:0;border-bottom:1px solid var(--line)}
.fw li{display:flex;gap:18px;padding:16px 0;border-top:1px solid var(--line);font-size:18px}
.fw b{color:var(--red);font-size:13px;padding-top:5px}
.fw small{display:block;color:var(--mute);font-size:14px}
.inst{margin-bottom:22px}
.opt{display:block;margin:0 0 10px;cursor:pointer}
.opt input{position:absolute;opacity:0}
.box{display:flex;gap:16px;align-items:center;padding:20px 22px;border:1px solid var(--line);border-radius:6px;font-size:18px;line-height:1.4}
.opt:hover .box{border-color:var(--mute)}
.dot{width:24px;height:24px;border:1.5px solid var(--dot);border-radius:50%;flex:none}
.opt input:checked+.box{border-color:var(--red);background:var(--sel)}
.opt input:checked+.box .dot{border-color:var(--red);background:var(--red);box-shadow:inset 0 0 0 5px var(--sel)}
.opt input:focus-visible+.box{outline:3px solid var(--red);outline-offset:2px}
.adv{background:var(--panel);border-left:3px solid var(--red);padding:16px 20px;margin:26px 0 18px}
.adv p{margin:0}
.adv p+p{margin-top:2px}
details{margin-bottom:26px}
summary{color:var(--red);font-weight:600;cursor:pointer;list-style:none}
summary::-webkit-details-marker{display:none}
summary::after{content:" \2304"}
details[open] summary::after{content:" \2303"}
details p{margin:10px 0 0;color:var(--mute)}
.nav{display:flex;gap:12px;justify-content:space-between}
.side{border:1px solid var(--line);border-radius:6px;overflow:hidden}
.sh{background:var(--panel);padding:18px 20px}
.sh p:last-child{margin:0}
.sr{display:grid;grid-template-columns:1fr auto;gap:8px 12px;padding:14px 20px;border-top:1px solid var(--line);border-left:3px solid transparent;font-size:15px}
.sr.cur{background:var(--panel);border-left-color:var(--red);font-weight:600}
.sr .t{grid-column:1/-1;height:3px;background:var(--line)}
.sr .t i{display:block;height:100%;background:var(--red)}
.sn{padding:14px 20px;margin:0;border-top:1px solid var(--line)}
.res{max-width:760px}
.score{display:flex;align-items:baseline;gap:10px;margin:0 0 6px}
.score b{font-size:clamp(84px,18vw,128px);line-height:1;letter-spacing:-.05em;color:var(--red)}
.score span{font-size:26px;color:var(--mute)}
.res .side{margin:26px 0}
.todo{padding-left:22px;margin:0}
.todo li{margin-bottom:14px;font-size:18px}
.cta{margin-top:34px;padding-top:28px;border-top:1px solid var(--line)}
@media (max-width:860px){.grid,.grid.wide{grid-template-columns:1fr;gap:36px}main{padding-top:36px}}
</style>
</head>
<body>
<main id="app"></main>
<script>
var LINK="https://www.estuate.com/services/enterprise-ai-advisory/ai-readiness-assessment/";
var STAGES=[
{n:"The Mirror",s:"Guessing → Knowing",d:"Do you know what AI your business is actually using?",w:"Your biggest gap is visibility. You can’t build on tools you can’t see. Start with a one-page list of what your team really uses."},
{n:"The Workbench",s:"Licensed → Building",d:"Are you building with AI, or just paying for it?",w:"Your biggest gap is turning individual habits into shared systems. Right now the good results live in people’s heads."},
{n:"The Edge",s:"Efficient → Harder to Compete With",d:"Is AI making you harder to compete with?",w:"Your biggest gap is getting customers to feel the difference. Faster inside the business isn’t an advantage until they notice."}];
var Q=[
["Do you know which AI tools your team used last week?","No idea","Some of them","Yes, all of them, and who uses each"],
["Can you name one task that’s quicker today because of AI?","No","Yes, but I haven’t measured it","Yes, and I know roughly how much time or money it saves"],
["Who decides which AI tools your team uses?","Whoever wants to try one","I approve some, but others slip in","One person manages a short approved list"],
["Do you have rules on what customer information can go into AI tools?","No rules","Unwritten, “everyone knows”","Written down, and the team follows it"],
["How do you know where you stand against competitors on AI?","Gut feel or what I’ve read","I’ve looked at a competitor or two","I’ve checked named competitors in the last six months"],
["When did you last ask your team what’s working and what isn’t with AI?","Never","A casual chat, nothing changed","Recently, and we changed something because of it"],
["Does your team actually use the AI tools you pay for?","At least one sits unused","Yes, but everyone uses them their own way","Yes, each tool has a set job and people stick to it"],
["Has any repeat job, like quotes, follow-ups, or reports, changed because of AI?","No","One has, but it needs babysitting","At least one now runs the same way every time"],
["When someone gets a great result from AI, what happens to it?","It stays with that person","They mention it, then it’s forgotten","It’s saved so others can reuse it"],
["If your most AI-savvy person left tomorrow, what would happen?","Most of it would leave with them","We’d lose some of it","Very little would change"],
["Is AI-written work checked before a customer sees it?","Not usually","Usually, but there’s no set standard","Always, and one person owns the check"],
["Have you loaded your own material into your AI tools, such as pricing, past jobs, or how you talk to customers?","No","Once, a little","Yes, and we keep it up to date"],
["Has AI changed what you can promise customers?","No","We’re faster inside, but customers haven’t noticed","Yes, and customers have commented on it"],
["If a competitor bought the same AI tools tomorrow, what would you lose?","Nothing, we’d be level","Some speed","Not much, because what we’ve built around the tools can’t be bought"],
["Has AI changed how you price or package your work?","No","It’s improved our margins, but prices are the same","Yes, we’ve changed pricing or taken on work we’d have turned down"],
["How fast do you respond to a new enquiry compared to a year ago?","About the same","Faster sometimes, depending on who picks it up","Measurably faster, and it’s winning us jobs"],
["Can you name a customer you won or kept because of something AI lets you do?","No","I suspect so, but can’t prove it","Yes, I can name them"],
["What happens to the time AI saves?","I’m not sure it’s been used for anything","It gets absorbed into more of the same work","We’ve pointed it at growing the business"]];
var TIERS=[
{max:12,t:"You’re using AI, but you can’t see it yet.",d:"Someone on your team has probably tried ChatGPT or a similar tool, maybe you have too, but nobody could tell you what it’s used for, what it costs, or what it’s saved. Nothing is written down and nobody owns it, so AI is happening in your business without being part of it. Any sense you have of being “about right” is a guess.",
a:["Ask every person on your team one question this week: “What AI tools do you use for work, and what for?” Put the answers in one shared list, including free tools and personal accounts.","Pick the task that eats the most hours each week (quotes, scheduling, follow-ups, reports) and write down how long it takes now. You can’t see what AI changes without a starting number.","Write a three-line rule on customer information: what can never be pasted into an AI tool, what’s fine, and who to ask. Send it to the team today."],
c:"You need a clear picture before a plan. Start with the free AI Reality Check and fill it in with your team this week.",b:"Get the free AI Reality Check"},
{max:24,t:"You’re further along than most, and it’s not showing in the numbers yet.",d:"You know what tools your team uses and you have a few real wins, like a faster first draft or a cleaner weekly report. But the wins live in individual people’s habits. If your best AI user left, most of it would go with them, and customers haven’t noticed anything different. You’re getting efficiency from AI, not an advantage.",
a:["Take your best AI win and write it as a one-page how-to: the tool, the exact instructions, what gets checked, and who checks it. Then have a second person run it from the page alone.","Name one person as owner of AI in your business and give them two hours a week for the approved tool list, the customer-information rules, and a monthly “what’s working” review.","Pick one customer-facing moment (enquiry reply, quote turnaround, post-job follow-up), set a target such as “every enquiry gets a real reply within 30 minutes,” and track it for 30 days."],
c:"The gap is usually a few processes built properly and a team running them the same way. That’s what the AI Builders Cohort is for.",b:"Join the AI Builders Cohort"},
{max:36,t:"You’ve built something. Now it’s about how fast you can extend it.",d:"You know what’s running, who owns it, and what it’s worth. At least some of your processes run the same way whoever does them, and you can point to customers who chose or stayed with you because of it. The risk at this score isn’t being behind. Your own time is now the bottleneck, and every new system competes with running the business.",
a:["List every AI-supported process and put a rough dollar figure against each (hours saved, jobs won, errors avoided). Double down on the top two and question the bottom two.","Find the part of your service customers still wait on (quotes, scheduling, onboarding, reporting) and ask if it could take a quarter of the time. If yes, that’s your next build.","Document your best system so a new hire could run it from your notes. If a competitor couldn’t copy it from the outside, it’s an asset. If not, that’s the work."],
c:"You don’t need more tips, you need more hours. Hand your next build to us and stay in the business instead of the tools.",b:"Start a done-for-you build"}];
var TIP=["Think about last week specifically, not what the team could be using.","Think of a task you could show someone, not one you’ve only been told about.","Think about who would actually say yes or no to a new tool today.","Think about whether a new hire would find this rule without asking.","Think about what you’ve checked yourself, not what you’ve heard at events.","Think about whether anything changed afterward, not just whether you asked.","Think about logins, not licences. Who opened the tool this week?","Think about a job that now runs differently, not one that’s just easier for one person.","Think about the last time it happened and where the result ended up.","Think about who else could run it from a written note today.","Think about the last thing a customer received that AI helped write.","Think about whether the tool knows your business or only the internet.","Think about what a customer can see or feel, not what changed behind the scenes.","Think about what’s left if the subscription is the only thing a competitor copies.","Think about your last price list or package. Did AI change it?","Think about the typical enquiry, not your best day.","Think of a real customer name. If none comes to mind, that’s your answer.","Think about where last month’s saved hours actually went."];
var WHY=["You can’t manage, secure, or improve what you can’t name. Every AI plan starts with this list.","Time saved is the first proof AI is doing anything. Without a number, it’s an opinion.","Tools that arrive unchecked bring cost, duplicates, and data risk. One owner fixes all three.","Customer details pasted into the wrong tool is the fastest way to create a problem you didn’t know you had.","Owners who guess their position tend to overestimate it. A direct look corrects that.","Your team sees what works long before you do. Acting on it shows them it’s worth reporting.","Paid tools nobody opens are the clearest sign of licensed, not building.","A changed process keeps its value when people are away. A personal habit doesn’t.","Good results that stay with one person disappear when that person does.","If one person holds all of it, your AI progress is one resignation away from zero.","One wrong AI-written line to a customer costs more trust than a hundred right ones earn.","Generic AI gives generic answers. Your pricing, history, and voice are what make it yours.","Customers pay for what they notice. Internal speed only matters if it reaches them.","If the tools are the only difference, you have no edge. What you build on top is the edge.","Pricing is where an advantage turns into money.","Speed of reply is one of the strongest levers on who wins the job.","A named customer turns a feeling into evidence.","Saved time only creates an advantage if it’s pointed at something."];
var app=document.getElementById("app"),scr="intro",idx=0,ans=[],order=[];
for(var i=0;i<18;i++){ans.push(null);var o=[0,1,2];for(var j=2;j>0;j--){var k=Math.floor(Math.random()*(j+1));var x=o[j];o[j]=o[k];o[k]=x}order.push(o)}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;")}
function ic(d){return '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="'+d+'"/></svg>'}
function show(){window.scrollTo(0,0);if(scr==="intro")intro();else if(scr==="q")ques();else result()}
function intro(){
var h='<div class="grid wide"><section><p class="eye">AI readiness assessment</p><h1>Most businesses think they’re further along with AI than they are.</h1><p class="lead">Answer 18 plain questions and get a scored result showing where you actually stand, and what to do first.</p><p class="why">Most businesses already pay for Copilot, ChatGPT, or both. Far fewer have changed how a single job gets done with them. That’s the gap. The tools are the same everywhere, so the businesses pulling ahead are the ones that built something on top of them.</p><div class="acts"><button class="btn" id="go">Start assessment '+ic("M5 12h14M13 6l6 6-6 6")+'</button></div><div class="meta"><span>'+ic("M12 7v5l3 2M21 12a9 9 0 11-18 0 9 9 0 0118 0z")+'About 5 minutes</span><span>'+ic("M4 6h16M4 12h16M4 18h10")+'18 questions</span><span>'+ic("M5 12l5 5L20 7")+'Your score and 3 first steps</span></div></section><aside><p class="eye g">The framework</p><ol class="fw">';
STAGES.forEach(function(S,i){h+='<li><b>0'+(i+1)+'</b><div>'+S.n+'<small>'+S.s+'</small></div></li>'});
h+='</ol><p class="note">Every answer is scored against these three stages, then read as one picture: what you think you have against what you’ve built.</p></aside></div>';
app.innerHTML=h;document.getElementById("go").onclick=function(){scr="q";idx=0;show()}}
function ques(){
var s=Math.floor(idx/6),S=STAGES[s],n=ans.filter(function(v){return v!==null}).length;
var h='<div class="grid"><section><p class="eye">'+ic("M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z")+S.n+'</p><h2>'+esc(Q[idx][0])+'</h2><p class="inst">Select the statement closest to how things work today.</p>';
order[idx].forEach(function(p){h+='<label class="opt"><input type="radio" name="a" value="'+p+'"'+(ans[idx]===p?' checked':'')+'><span class="box"><i class="dot"></i>'+esc(Q[idx][p+1])+'</span></label>'});
h+='<div class="adv"><p class="eye g">Advisor note</p><p>'+TIP[idx]+'</p></div><details><summary>Why this matters</summary><p>'+WHY[idx]+'</p></details><div class="nav"><button class="btn ghost" id="back">Back</button><button class="btn" id="next"'+(ans[idx]===null?' disabled':'')+'>'+(idx===17?'See my scorecard':'Continue')+'</button></div></section><aside class="side"><div class="sh"><p class="eye g">Readiness framework</p><p>'+n+' of 18 answered</p></div>';
STAGES.forEach(function(X,i){var c=0;for(var q=i*6;q<i*6+6;q++)if(ans[q]!==null)c++;h+='<div class="sr'+(i===s?' cur':'')+'"><span>'+X.n+'</span><b>'+c+'/6</b><div class="t"><i style="width:'+(c/6*100)+'%"></i></div></div>'});
h+='<p class="note sn">Your score appears when all 18 questions are answered.</p></aside></div>';
app.innerHTML=h;
app.querySelectorAll("input").forEach(function(el){el.onchange=function(){ans[idx]=+el.value;ques();app.querySelector("input:checked").focus()}});
document.getElementById("next").onclick=function(){if(idx<17)idx++;else scr="res";show()};
document.getElementById("back").onclick=function(){if(idx>0)idx--;else scr="intro";show()}}
function result(){
var st=[0,0,0],tot=0;ans.forEach(function(v,i){st[Math.floor(i/6)]+=v;tot+=v});
var T=TIERS.filter(function(t){return tot<=t.max})[0],weak=st.indexOf(Math.min.apply(null,st));
var h='<div class="res"><p class="eye">Your scorecard</p><div class="score"><b>'+tot+'</b><span>out of 36</span></div><h2>'+T.t+'</h2><p class="lead">'+T.d+'</p><div class="side"><div class="sh"><p class="eye g">Score by stage</p></div>';
STAGES.forEach(function(S,i){h+='<div class="sr'+(i===weak?' cur':'')+'"><span>'+S.n+(i===weak?' (biggest gap)':'')+'</span><b>'+st[i]+'/12</b><div class="t"><i style="width:'+(st[i]/12*100)+'%"></i></div></div>'});
h+='</div><div class="adv"><p class="eye g">Where to focus</p><p>'+STAGES[weak].w+'</p></div>';
if(ans[4]===2&&ans[16]===0)h+='<div class="adv"><p class="eye g">One thing stands out</p><p>You said you’ve checked how competitors are doing, but you can’t name a customer AI has won or kept for you. That’s the gap between how far along you feel and what you can prove.</p></div>';
h+='<h2 class="h3">Do these three things first</h2><ol class="todo">';
T.a.forEach(function(a){h+='<li>'+esc(a)+'</li>'});
h+='</ol><div class="cta"><p class="lead">'+T.c+'</p><a class="btn" href="'+LINK+'" target="_blank" rel="noopener">'+T.b+' '+ic("M5 12h14M13 6l6 6-6 6")+'</a></div><p style="margin-top:28px"><button class="btn ghost" id="again">Retake the assessment</button></p></div>';
app.innerHTML=h;document.getElementById("again").onclick=function(){location.reload()}}
show();
</script>
</body>
</html>
